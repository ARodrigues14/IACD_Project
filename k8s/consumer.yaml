apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      enableServiceLinks: false
      containers:
      - name: consumer
        image: smtuc-spark:v1
        imagePullPolicy: Never
        command: ["python3", "/opt/spark/work-dir/src/consumer_monitor.py"]
